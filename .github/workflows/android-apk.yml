name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk chatter.apk

      - name: Upload APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: chatter-android-debug-apk
          path: chatter.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Chatter Android APK ${{ github.run_number }}
          make_latest: true
          files: chatter.apk
