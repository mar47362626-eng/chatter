<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f6" />
    <meta name="description" content="Open Chatter chats, communities, and calls." />
    <title>Chatter app</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <style>
      * { box-sizing: border-box; }
      html, body, main, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      html, body { min-width: 320px; min-height: 100%; overflow: hidden; background: #f5f7f6; }
      main { height: 100vh; height: 100dvh; }
      iframe { display: block; height: 100%; background: #f5f7f6; }
    </style>
  </head>
  <body>
    <main>
      <iframe
        title="Chatter mobile and tablet app"
        src="index.html?app=1"
        allow="autoplay; camera; microphone; display-capture"
        referrerpolicy="same-origin"
      ></iframe>
    </main>
  </body>
</html>
